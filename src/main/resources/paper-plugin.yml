name: economy
version: '1.0-SNAPSHOT'
main: org.quintilis.economy.Economy
api-version: '1.21'
folia-supported: true


commands:
    listing:
        description: Main listing command
        aliases: [l]
        usage: /listings [subcomando]
    transfer:
        description: Main transfer command
        aliases: [t]
        usage: /transfer [subcomando]
    market:
        description: Main buy command
        aliases: [m]
        usage: /market [subcomando]
        
dependencies:
    server:
        FancyNpcs:
            load: BEFORE
            required: false
            join-classpath: true
        PlaceholderAPI:
            load: BEFORE
            required: true
            join-classpath: true