error.invalid_page = <red>Invalid page. Please use a number between [1-<arg:0>].
error.is_not_player = This command can only be run by a player.
error.unknown_subcommand = <red>Unknown subcommand: <arg:0>.
error.no_permission = <red>You do not have permission to use this command.

help.header = <gold>---[ Factions Help (Page <arg:0>/<arg:1>) ]---</gold>
help.footer = <gold>---[ Type /help <page> to see more ]---</gold>

help.command.format = <gold><click:suggest_command:'<arg:0>'><hover:show_text:'<gray>Click to suggest a command...'></hover>'><arg:0></click></gold><gray>: <arg:1></gray>


help.command.listing.description = Main command for market listings.
listing.create.command.description = Command to sell the item in your hand. Price (no commas) and quantity are passed.\
    \ (If no quantity is passed, the whole stack will be sold)\
    \ The value will only be deposited when another player buys the item.
listing.remove.command.description = Command to remove a market listing. The listing ID is passed, the item is removed and returned to your inventory (if there is space, otherwise it drops on the ground).