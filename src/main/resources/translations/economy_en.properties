error.invalid_page = <red>Invalid page. Please use a number between [1-<total_pages>].
error.is_not_player = This command can only be used by a player.
error.unknown_subcommand = <red>Unknown subcommand: <command_name>.
error.no_permission = <red>You do not have permission to use this command.

help.header = <gold>---[ Factions Help (Page <page>/<total_pages>) ]---</gold>
help.footer = <gold>---[ Type <bold>/<command> help <page></bold> to see more ]---</gold>

help.command.format = <gold><command></gold><gray>: <description></gray>

help.command.listing.description = Main command for market listings.
listing.create.command.description = Command to sell the item in your hand. Provide a price (no commas) and quantity\
    \ (if no quantity is given, the whole stack is sold).\
    \ You will be paid when another player buys the item.
listing.remove.command.description = Command to remove a market listing. Provide the listing ID.\
    \ The item will be returned to your inventory (if there is no space, it will be dropped on the ground).