error.invalid_page = <red>Página invalida. Por favor, use um número entre [1-<total_pages>].
error.is_not_player = Esse comando só pode ser usado por um jogador.
error.unknown_subcommand = <red>Subcomando desconhecido: <command_name>.
error.no_permission = <red>Você não tem permissão de usar esse comando.

help.header = <gold>---[ Ajuda Factions (Página <page>/<total_pages>) ]---</gold>
help.footer = <gold>---[ Digite <bold>/<command> help <pagina></bold> para ver mais ]---</gold>

help.command.format = <gold><command></gold><gray>: <description></gray>

help.command.listing.description = Comando principal para anúncios no mercado.
listing.create.command.description = Comando para vender item segurado na mão, é passado o preço sem vírgula e a quantidade de itens para vender\
    \ (se nenhum valor for passado na quantidade, o que estiver na mão será vendido)\
    \ o valor só será depositado quando outro jogador comprar o item.
listing.remove.command.description = Comando que remove anúncio do mercado, é passado o id do anúncio e ele é removido e o item volta para seu inventário (deve haver espaço, se não ele é jogado no chão).