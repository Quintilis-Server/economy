#help.command.listing.description = Comando principal para anúncios no mercado.

listing.balance.command.description = Comando para mostrar seu saldo no mercado.
listing.balance.response = Seu saldo atual é de: <bold><points></bold>

listing.create.command.description = Comando para vender item segurado na mão, é passado o preço sem vírgula e a quantidade de itens para vender\
    \ (se nenhum valor for passado na quantidade, o que estiver na mão será vendido)\
    \ o valor só será depositado quando outro jogador comprar o item.
listing.create.response = Anúncio <id> criado com sucesso. Você recebera o valor quando outro player comprar seu item
listing.create.error.no_item_in_hand = <red>Nenhum item na sua mão, segure algo para vender.
listing.create.error.invalid_amount = <red>Item na mão insuficientes.

listing.remove.command.description = Comando que remove anúncio do mercado, é passado o id do anúncio e ele é removido e o item volta para seu inventário (deve haver espaço, se não ele é jogado no chão).

listing.givepoints.command.description = Comando de ADM que dá pontos a um jogador
listing.givepoints.response = <bold><points></bold> Pontos dados à jogador <bold><player_name></bold>

listing.list.command.description = Lista todos os anúncios de um jogador. Se nenhum argumento for passado ele vai listar os anúncios do jogador.
listing.list.response = Anúncios do jogador <bold><player></bold>:
listing.list.line_response = <gray> ID <id></gray>: <gold><item_name></gold> (<quantity>x) por <bold><price></bold> cada

listing.market.command.description = Abre a janela do mercado